<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1217" />
  <title>Captain Brandy's Compass</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-live="polite">
    <section id="startScreen" class="screen start-screen">
      <div class="parchment-card start-card">
        <div class="eyebrow">Captain Brandy's</div>
        <h1>Compass</h1>
        <img class="compass-mark" src="compass-mark.svg" alt="" aria-hidden="true" />
        <p class="tagline">Not all treasures are marked on maps.</p>
        <p id="targetSummary" class="muted"></p>
        <div class="start-route-cta">
          <button id="startButton" class="route-button" type="button">Follow the compass</button>
        </div>
        <p class="hint">Location and motion permissions are required.</p>
      </div>
    </section>

    <section id="navScreen" class="screen hidden nav-screen">
      <div class="distance-card" aria-live="polite">
        <div class="distance-label">Your desire lies</div>
        <div id="distance" class="distance">—</div>
        <div class="distance-ornament" aria-hidden="true">← ✦ →</div>
      </div>

      <div class="compass-shell" aria-label="Direction to target">
        <div class="compass-bezel">
          <div class="compass-face">
            <div class="ticks" aria-hidden="true"></div>
            <div class="cardinal north">N</div>
            <div class="cardinal east">E</div>
            <div class="cardinal south">S</div>
            <div class="cardinal west">W</div>
            <div class="rose" aria-hidden="true"></div>

            <div id="arrow" class="needle" aria-hidden="true">
              <div class="needle-half needle-red"></div>
              <div class="needle-half needle-white"></div>
              <div class="needle-spine"></div>
              <div class="needle-pivot"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="guidance" class="guidance">Keep going, Captain!</div>


      <div id="status" class="status">Acquiring position…</div>
      <button id="recalibrateButton" class="secondary" type="button">Re-enable compass</button>
    </section>

    <section id="foundScreen" class="screen hidden found-screen">
      <div class="parchment-card found-card">
        <div class="treasure-mark">✦</div>
        <h1>You found it!</h1>
        <p class="found-copy">What you seek, you have found.</p>
        <p id="foundDistance" class="distance found-distance"></p>
      </div>
    </section>

    <section id="errorScreen" class="screen hidden">
      <div class="parchment-card error-card">
        <h1>Cannot start</h1>
        <p id="errorMessage"></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
