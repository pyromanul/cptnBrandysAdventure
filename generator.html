<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waypoint Link Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 20px; }
    label { display:block; margin-top:18px; font-weight:700; }
    input { width:100%; box-sizing:border-box; padding:10px; font:inherit; }
    button { margin-top:20px; padding:10px 16px; font:inherit; cursor:pointer; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:14px; background:#eee; }
  </style>
</head>
<body>
  <h1>Waypoint Link Generator</h1>
  <p>Enter the target coordinates. Put the generated URL into any QR-code generator.</p>

  <label for="base">Base URL</label>
  <input id="base" value="https://example.com/index.html" />

  <label for="lat">Latitude</label>
  <input id="lat" type="number" step="any" placeholder="47.0707" />

  <label for="lon">Longitude</label>
  <input id="lon" type="number" step="any" placeholder="15.4395" />

  <button id="make">Generate link</button>
  <pre id="result">—</pre>

  <script>
    document.getElementById('make').addEventListener('click', () => {
      const base = document.getElementById('base').value.trim();
      const lat = Number(document.getElementById('lat').value);
      const lon = Number(document.getElementById('lon').value);
      const out = document.getElementById('result');
      if (!base || !Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
        out.textContent = 'Please enter a valid base URL and coordinates.';
        return;
      }
      out.textContent = `${base}#${lat},${lon}`;
    });
  </script>
</body>
</html>
